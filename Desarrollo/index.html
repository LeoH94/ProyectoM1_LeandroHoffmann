<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Paleta de Colores</title>
</head>
<body>
    
    <header>
        
        <h1>PALETA DE COLORES</h1>

        <label for="selectorCantidad">Selecciona la cantidad de paletas: </label>
        <select id="cantidadPaleta" name="selectorCantidad">
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="9">9</option>
        </select>

        <label for="selectorFormato">Selecciona formato de colores: </label>
        <select id="formatoColores" name="selectorFormato">
            <option value="HSL">HSL</option>
            <option value="HEX">HEX</option>
            <option value="RGBA">RGBA</option>
        </select>
        
    </header>

    <script src="./app.js"></script>

</body>
</html>
