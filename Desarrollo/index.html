<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Paleta de Colores</title>
</head>
<body>
    
    <header>
        
        <h1>PALETA DE COLORES</h1>

        <label for="cantidadColores">Selecciona la cantidad de colores: </label>
        <select id="cantidadColores">
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="9">9</option>
        </select>

        <label for="formatoColores">Selecciona formato de colores: </label>
        <select id="formatoColores">
            <option value="HSL">HSL</option>
            <option value="HEX">HEX</option>
        </select>

        <button id="btnGenerar">Generar paleta</button>
        
    </header>

    <main>

        <div id="contenedorPaletas">
            <section id="color1"></section>
            <section id="color2"></section>
            <section id="color3"></section>
            <section id="color4"></section>
            <section id="color5"></section>
            <section id="color6"></section>
        </div>

    </main>

    <script src="./app.js"></script>

</body>
</html>
